[package]
name = "crypto-scanner"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version =  "0.12.22", features = ["json"] }
tokio = { version = "1.46.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0.12"
teloxide = "0.9"
futures = "0.3"
env-file-reader = "0.3.0"
